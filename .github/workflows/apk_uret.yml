name: AmllyEdit Pad - Otomatik APK Uretici

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build_apk:
    name: Bulutta Tablet APK Uret
    runs-on: ubuntu-latest

    steps:
      - name: 1. Kodlari Cek
        uses: actions/checkout@v4

      - name: 2. Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Flutter SDK Kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: 4. Temiz Proje Iskeletini ve Tam Kodlari Olustur
        run: |
          rm -rf build_app
          flutter create --org com.amllystudio --project-name amlly_edit_pad build_app
          mkdir -p build_app/lib/services build_app/lib/modules

          cat << 'EOF' > build_app/pubspec.yaml
          name: amlly_edit_pad
          description: "AmllyEdit Pad Studio"
          publish_to: 'none'
          version: 5.0.0+5

          environment:
            sdk: '>=3.2.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.2.3
            http: ^1.2.1

          dev_dependencies:
            flutter_test:
              sdk: flutter
          
          flutter:
            uses-material-design: true
          EOF
          sed -i 's/^          //' build_app/pubspec.yaml

          cat << 'EOF' > build_app/lib/services/zero_loss_cloud_service.dart
          import 'dart:async';
          import 'dart:convert';
          import 'package:flutter/foundation.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          class ZeroLossCloudService {
            static final ZeroLossCloudService _instance = ZeroLossCloudService._internal();
            factory ZeroLossCloudService() => _instance;
            ZeroLossCloudService._internal();

            static const String _localWalKeyPrefix = 'amlly_wal_snapshot_';

            Future<void> initialize({required String url, required String anonKey}) async {
              debugPrint('[ZERO-LOSS] Motor baslatildi.');
            }

            Future<void> commitStateInstantly({
              required String projectId,
              required String title,
              required int activeSeqIndex,
              required int playheadMs,
              required String aspectRatio,
              required List> sequencesState,
              required int versionSequence,
            }) async {
              final payload = {
                'id': projectId,
                'title': title,
                'active_sequence_index': activeSeqIndex,
                'playhead_position_ms': playheadMs,
                'aspect_ratio': aspectRatio,
                'sequences_state': sequencesState,
                'version_sequence': versionSequence,
                'last_synced_at': DateTime.now().toIso8601String(),
              };
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('$_localWalKeyPrefix$projectId', jsonEncode(payload));
            }

            Future?> restoreProjectState(String projectId) async {
              final prefs = await SharedPreferences.getInstance();
              final localRaw = prefs.getString('$_localWalKeyPrefix$projectId');
              return localRaw != null ? jsonDecode(localRaw) : null;
            }
          }
          EOF

          cat << 'EOF' > build_app/lib/services/anti_lag_proxy_thermal_engine.dart
          import 'dart:io';
          import 'package:flutter/foundation.dart';

          enum PreviewProxyMode {
            full("1/1 Tam Kalite", 1.0, "1920:1080"),
            half("1/2 Akıcı (Önerilen)", 0.5, "960:540"),
            quarter("1/4 Ultra Hızlı (Sıfır Kasma)", 0.25, "640:360");

            final String label;
            final double scaleFactor;
            final String resolutionFlag;
            const PreviewProxyMode(this.label, this.scaleFactor, this.resolutionFlag);
          }

          class AntiLagPerformanceEngine extends ChangeNotifier {
            PreviewProxyMode currentProxyMode = PreviewProxyMode.half;
            bool isHardwareGpuEnabled = true;
            bool isThermalGuardTriggered = false;

            void setProxyMode(PreviewProxyMode mode) {
              currentProxyMode = mode;
              notifyListeners();
            }

            Future<String> getOrCreateSmoothProxy({
              required String originalVideoPath,
              required String cacheDirPath,
            }) async {
              return originalVideoPath;
            }

            void checkThermalState(double batteryCelsius) {
              if (batteryCelsius >= 41.5 && !isThermalGuardTriggered) {
                isThermalGuardTriggered = true;
                currentProxyMode = PreviewProxyMode.quarter;
                notifyListeners();
              } else if (batteryCelsius <= 38.0 && isThermalGuardTriggered) {
                isThermalGuardTriggered = false;
                notifyListeners();
              }
            }
          }
          EOF

          cat << 'EOF' > build_app/lib/modules/ai_post_production_engine.dart
          import 'dart:math' as math;
          import 'package:flutter/material.dart';

          class AiPostProductionEngine {
            static Future<String?> stabilizeShakyVideo({
              required String inputPath,
              required String outputPath,
              int shakiness = 8,
              int smoothing = 22,
            }) async {
              return outputPath;
            }

            static Future<String?> applyOpticalFlowSlowMotion({
              required String inputPath,
              required String outputPath,
              double speedMultiplier = 0.5,
              int targetFps = 60,
            }) async {
              return outputPath;
            }

            static Future<String?> enhanceAndDenoiseVideo({
              required String inputPath,
              required String outputPath,
              bool upscaleTo1080p = true,
            }) async {
              return outputPath;
            }

            static Future<String?> cleanAudioNoiseAndNormalize({
              required String inputPath,
              required String outputPath,
              double noiseReductionDb = 24.0,
              bool normalizeTo14Lufs = true,
            }) async {
              return outputPath;
            }

            static List> generateAutoDuckingKeyframes({
              required int musicStartMs,
              required int musicDurationMs,
              required List<RangeValues> dialogueSpeechRangesMs,
              double duckAmountDb = -18.0,
              int fadeMs = 300,
            }) {
              final List> keyframes = [];
              final double loweredGain = math.pow(10, duckAmountDb / 20.0).toDouble();
              for (final range in dialogueSpeechRangesMs) {
                final startOffset = (range.start.toInt() - musicStartMs - fadeMs).clamp(0, musicDurationMs);
                final endOffset = (range.end.toInt() - musicStartMs + fadeMs).clamp(0, musicDurationMs);
                keyframes.add({'offsetMs': startOffset, 'volume': loweredGain});
                keyframes.add({'offsetMs': endOffset, 'volume': 1.0});
              }
              return keyframes;
            }
          }
          EOF

          cat << 'EOF' > build_app/lib/modules/export_render_queue_engine.dart
          class ExportRenderEngine {
            static double estimateFileSizeMb({required int durationMs, required double bitrateMbps}) {
              final double seconds = durationMs / 1000.0;
              return ((bitrateMbps + 0.192) * seconds) / 8.0;
            }

            static Future<bool> renderMasterVideo({
              required String inputPath,
              required String outputPath,
              String resolution = "1920:1080",
              int fps = 60,
              String codec = "libx264",
            }) async {
              return true;
            }
          }
          EOF

          cp premiere_capcut_timeline_engine.dart build_app/lib/modules/premiere_capcut_timeline_engine.dart
          cp main.dart build_app/lib/main.dart
          sed -i 's/movie_Creation_outlined/movie_creation_outlined/g' build_app/lib/main.dart
          sed -i 's/Dynamic_feed/dynamic_feed/g' build_app/lib/main.dart
          sed -i 's/auto_Awesome_outlined/auto_awesome_outlined/g' build_app/lib/main.dart

      - name: 5. Paketleri Indir ve APK Derle
        working-directory: build_app
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: 6. Hazir APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: AmllyEdit_Pad_Hazir_APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
